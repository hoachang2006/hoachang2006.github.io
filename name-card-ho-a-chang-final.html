<title>Hờ A Cháng — Name Card</title>
<style>
*{box-sizing:border-box}
body{
  margin:0; min-height:100vh; font-family:Arial,Helvetica,sans-serif;
  background:linear-gradient(145deg,#111827,#1f2937 55%,#374151);
  color:#fff; display:flex; justify-content:center; align-items:center;
  padding:22px;
}
.card{
  width:100%; max-width:430px; background:rgba(255,255,255,.10);
  border:1px solid rgba(255,255,255,.16); border-radius:28px;
  padding:28px 20px 22px; text-align:center;
  box-shadow:0 25px 70px rgba(0,0,0,.35);
  backdrop-filter:blur(18px);
}
.avatar{
  width:92px;height:92px;border-radius:50%;margin:0 auto 16px;
  background:linear-gradient(135deg,#fff,#cbd5e1);
  color:#111827;display:flex;align-items:center;justify-content:center;
  font-size:30px;font-weight:800;border:4px solid rgba(255,255,255,.35);overflow:hidden;
}
.avatar img{width:100%;height:100%;object-fit:cover;display:block}h1{margin:0;font-size:29px}
.sub{margin:7px 0 24px;color:#cbd5e1;font-size:14px}
.buttons{display:grid;gap:12px}
a.btn{
  display:flex;align-items:center;gap:13px;text-decoration:none;color:#fff;
  background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.10);
  border-radius:16px;padding:15px 17px;font-size:16px;font-weight:600;
  transition:.2s;
}
a.btn:hover{transform:translateY(-2px);background:rgba(255,255,255,.18)}
.icon{width:30px;font-size:21px}
.save{margin-top:16px;background:#fff!important;color:#111827!important;justify-content:center}
.footer{margin-top:20px;color:#9ca3af;font-size:12px}
</style>
